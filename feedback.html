<!DOCTYPE html>
<html>

<head>

    <title>Library Feedback</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="logo">📚</div>

        <h1>Library Feedback</h1>

        <p class="subtitle">
            We value your feedback
        </p>

        <form>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text"
                       placeholder="Enter your name"
                       required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email"
                       placeholder="Enter your email"
                       required>
            </div>

            <div class="form-group">

                <label>How was your experience?</label>

                <div class="radio-group">

                    <label>
                        <input type="radio"
                               name="experience"
                               value="excellent"
                               required>
                        Excellent
                    </label>

                    <label>
                        <input type="radio"
                               name="experience"
                               value="good">
                        Good
                    </label>

                    <label>
                        <input type="radio"
                               name="experience"
                               value="average">
                        Average
                    </label>

                    <label>
                        <input type="radio"
                               name="experience"
                               value="poor">
                        Poor
                    </label>

                </div>

            </div>


            <div class="form-group">

                <label>Feedback</label>

                <textarea
                    rows="5"
                    placeholder="Write your feedback here..."
                    required></textarea>

            </div>


            <button class="btn" type="submit">
                Submit Feedback
            </button>

            <button class="btn reset-btn" type="reset">
                Clear
            </button>

        </form>


        <div class="links">

            <p>
                <a href="login .html">Back to Login</a>
            </p>

        </div>

    </div>

</body>

</html>
